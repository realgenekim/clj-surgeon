# social-media-writer — slot roles by path convention.
# Five slots, receipt order. Roles from the repo's own layout:
#   menu-caller  Hiccup menu/view forms that carry :onclick / :data-star-on:click
#   js-function  the browser command-bridge function
#   route        the reitit route table
#   handler      the Clojure handler form the route names
#   tests        Clojure and node test files
REPO_LABEL="social-media-writer"
EXCLUDE="!OLD/** !drafts/** !compiles/** !node_modules/** !resources/public/vendor/** !.git/** !.beads/**"
SLOT_IDS="menu-caller js-function route handler tests"

GLOBS_menu_caller="src/**/views/*.clj src/**/views/**/*.clj src/**/components.clj"
KIND_menu_caller="use"

GLOBS_js_function="resources/public/js/*.js src/**/*.cljs"
KIND_js_function="def"

GLOBS_route="src/**/routes.clj src/**/routes/**/*.clj"
KIND_route="route"

GLOBS_handler="src/**/handlers/*.clj src/**/handlers.clj"
KIND_handler="handler"

GLOBS_tests="test/**/*.clj test/*.clj test/**/*.js test/*.js test/**/*.mjs test/*.mjs"
KIND_tests="test"
