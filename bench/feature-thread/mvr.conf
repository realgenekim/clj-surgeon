# marvin-voice-remote — slot roles by path convention.
# The Marvin dictation app is a Clojure server + Datastar/JS hosted page + a
# Prolog invariant oracle, so its five roles are NOT smw's five:
#   ui-js-caller     the hosted page's JS (resources/public/js)
#   server-route     the one reitit route table in server.clj
#   handler          the Clojure handler form the route names
#   state-contract   where the feature's state or its invariant row lives
#                    (the reducer namespaces, or the intent registry)
#   tests-oracle     Clojure/node/TS tests AND the Prolog oracles
REPO_LABEL="marvin-voice-remote"
EXCLUDE="!node_modules/** !.git/** !.beads/** !logs/** !drafts/** !mobile/expo-companion/node_modules/**"
SLOT_IDS="ui-js-caller server-route handler state-contract tests-oracle"

GLOBS_ui_js_caller="resources/public/js/*.js"
KIND_ui_js_caller="def"

GLOBS_server_route="src/**/server.clj src/**/app_route.clj"
KIND_server_route="route"

GLOBS_handler="src/**/*.clj"
KIND_handler="handler"

GLOBS_state_contract="src/**/reducer/*.clj src/**/reducer.clj docs/intent/registry.edn"
KIND_state_contract="use"

GLOBS_tests_oracle="test/**/*.clj test/*.clj test/**/*.pl test/*.pl test/**/*.mjs test/*.mjs test/**/*.js test/*.js mobile/**/*.test.ts"
KIND_tests_oracle="test"
