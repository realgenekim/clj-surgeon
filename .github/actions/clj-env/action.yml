name: clj-env
description: >-
  Java 21 + Clojure CLI + babashka + a warm ~/.m2 / ~/.gitlibs cache, and a
  temp root the repo's tmp-hygiene guard will accept. Every job in
  mcp-main.yml starts here, so "what a clj-surgeon runner is" is defined once.

inputs:
  apt:
    description: >-
      Extra apt packages this job needs, space separated (e.g. "swi-prolog
      strace"). Empty means no apt run at all -- apt is 20-40 s and most cells
      do not need it.
    required: false
    default: ''
  clj-kondo:
    description: 'Install clj-kondo (true/false). Needed by admit-patch-test and the kondo admission self-test.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Java (Temurin 21)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Clojure CLI + babashka
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: latest
        bb: latest
        clj-kondo: ${{ inputs.clj-kondo == 'true' && 'latest' || '' }}

    - name: Cache Clojure deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
          .cpcache
        key: cljdeps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
        restore-keys: cljdeps-${{ runner.os }}-

    # clj-surgeon's OWN executable resolver (mcp-change-buffer/expand-command)
    # does NOT consult $PATH. It walks a hardcoded list -- /opt/homebrew/...,
    # /usr/local/bin, /usr/bin, /bin -- and returns the BARE NAME when the
    # binary is in none of them. setup-clojure puts clj-kondo in the runner's
    # tool cache, which is on PATH and in none of those five directories, so
    # `mcp-change-buffer-test` and `mcp-cold-verify-test` both failed with
    # "resolved clj-kondo must be an absolute path, not a bare name" and
    # :clj-kondo-executable-unavailable. The seat passes only because its
    # clj-kondo happens to sit in /usr/local/bin.
    #
    # This link makes the runner satisfy that undeclared precondition. It is a
    # WORKAROUND, not the fix: the resolver ignoring $PATH is a real portability
    # defect, reported in docs/observations/2026-09-04-gha-round1.md.
    - name: Put clj-kondo where clj-surgeon's resolver actually looks
      if: inputs.clj-kondo == 'true'
      shell: bash
      run: |
        real=$(command -v clj-kondo)
        echo "clj-kondo on PATH: $real"
        if [ "$real" != "/usr/local/bin/clj-kondo" ]; then
          sudo ln -sf "$real" /usr/local/bin/clj-kondo
          echo "linked -> /usr/local/bin/clj-kondo"
        fi
        /usr/local/bin/clj-kondo --version

    - name: Install apt packages
      if: inputs.apt != ''
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ${{ inputs.apt }}

    # MCP-OP-TMPHYG-001/002: clj-surgeon.tmp-leak-support REFUSES a temp base
    # that is RAM-backed, and it refuses /tmp and /dev/shm BY NAME -- on this
    # seat's box /tmp really is a tmpfs, and the guard does not re-litigate
    # that per host. GitHub's runner.temp is on the same ext4 disk as the
    # workspace and is not named /tmp, so it passes both the name check and
    # the /proc/mounts check, and the runner discards it after the job.
    - name: Point TMPDIR at a disk-backed root the tmp guard accepts
      shell: bash
      run: |
        root="${RUNNER_TEMP}/clj-surgeon-tmp"
        mkdir -p "$root" "${RUNNER_TEMP}/clj-surgeon-memory"
        {
          echo "TMPDIR=$root"
          echo "TMP=$root"
          echo "TEMP=$root"
          # txn-journal-test defaults to the seat-absolute /home/forge/tmp.
          echo "CLJ_SURGEON_MEMORY_TMP=${RUNNER_TEMP}/clj-surgeon-memory"
        } >> "$GITHUB_ENV"
        echo "temp root: $root ($(df -T "$root" | tail -1 | awk '{print $2}'))"
